name: solar system workflow
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
jobs:
  unit-testing:
    strategy:
      matrix:
        nodejs-version: [18, 20]
        operating-system: [ubuntu-latest, macos-latest]
        exclude:
          - nodejs-version: 18
            operating-system: macos-latest

    runs-on: ${{ matrix.operating-system }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js environment
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.nodejs-version }}
      - name: Install dependencies npm
        run: |
          npm install

      - name: Run unit tests
        run: |
          npm test

      - name: Archive test results
        if : failure()  # Only upload test results if the tests fail 
        #failure() is a GitHub Actions function that returns true 
        #if any of the previous steps in the job have failed. 
        #By using this condition, you can ensure that the test results are only uploaded when there is a failure, which can help save storage space and reduce clutter in your artifacts.
        uses: actions/upload-artifact@v4
        with:
          name: Mocha Test Results
          path: mocha-test-results.xml
          overwrite: true
  code-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js environment
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies npm
        run: |
          npm install

      - name: Run code coverage
        run: |
          npm run coverage
        continue-on-error: true

      - name: Upload code coverage report
        uses: actions/upload-artifact@v4
        with:
          name: Code Coverage Report
          path: coverage/cobertura-coverage.xml
        